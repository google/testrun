<div class="search-field" [class.focused]="isFocused">
  <button
    type="button"
    mat-icon-button
    #filterButton
    class="filter-button"
    [class.active]="hasActiveFilters() || filterOpened"
    (click)="menuTrigger.toggleMenu()"
    matTooltip="Filter reports"
    aria-label="Filter reports"
    aria-haspopup="menu"
    [attr.aria-expanded]="isMenuOpened">
    <mat-icon
      fontSet="material-icons-outlined"
      class="filter-icon"
      aria-hidden="true">
      filter_alt
    </mat-icon>
  </button>

  <div
    aria-hidden="true"
    class="search-menu-trigger"
    #menuTrigger="matMenuTrigger"
    [matMenuTriggerFor]="filterMenu"
    (menuOpened)="isMenuOpened = true"
    (menuClosed)="isMenuOpened = false"></div>

  <div class="search-content">
    @for (item of getActiveFilters(); track item.key) {
      <div
        class="filter-chip"
        tabindex="0"
        role="button"
        [attr.aria-label]="getChipAriaLabel(item.key, item.value)">
        <span class="filter-chip-label">
          {{ getFilterChipLabel(item.key, item.value) }}
        </span>
        <button
          type="button"
          class="filter-chip-remove"
          [attr.aria-label]="getRemoveFilterAriaLabel(item.key, item.value)"
          (click)="removeFilter(item.key, $event)"
          (keydown.enter)="removeFilter(item.key, $event)"
          (keydown.space)="removeFilter(item.key, $event)">
          <mat-icon class="chip-close-icon" aria-hidden="true">close</mat-icon>
        </button>
      </div>
    }

    <input
      #searchInput
      type="text"
      class="search-input"
      [placeholder]="'Add a filter'"
      [value]="inputValue"
      (input)="onInputChange($event)"
      (keydown.enter)="onEnter($event)"
      (keydown.backspace)="onBackspace()"
      (focus)="isFocused = true"
      (blur)="isFocused = false"
      aria-label="Search reports" />
  </div>

  @if (inputValue || hasActiveFilters()) {
    <button
      type="button"
      mat-button
      class="clear-button"
      aria-label="Clear all filters"
      (click)="clearAll($event)">
      Clear all
    </button>
  }
</div>

<mat-menu
  #filterMenu="matMenu"
  class="search-filter-menu"
  yPosition="below"
  [overlapTrigger]="false">
  @for (menuItem of filterMenuItems; track menuItem) {
    <button
      mat-menu-item
      class="filter-menu-item"
      [class.active-filter-item]="isFilterActive(menuItem.name)"
      (click)="openFilterMenu(menuItem.name, menuItem.title, $event)">
      <span>{{ menuItem.displayName }}</span>
    </button>
  }
</mat-menu>
